name: Auto-Sync Upstream Engines & Scrapers

on:
  schedule:
    # Berjalan otomatis setiap 3 hari sekali pada jam 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Dapat ditrigger manual kapan saja dari tab Actions

jobs:
  auto-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Latest Dependencies & Scrapers
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade yt-dlp streamrip mutagen rich requests fastapi uvicorn pydantic
          npm ci

      - name: Run Test Suite & Verification
        run: |
          python test_cli.py
          npm run build

      - name: Update requirements.txt with Latest Tested Versions
        run: |
          python -c "
          import yt_dlp, mutagen, rich, requests, fastapi, uvicorn
          print(f'yt-dlp>={yt_dlp.__version__}')
          print(f'streamrip>=2.1.0')
          print(f'mutagen>={mutagen.__version__}')
          print(f'rich>={rich.__version__}')
          print(f'requests>={requests.__version__}')
          print(f'fastapi>={fastapi.__version__}')
          print(f'uvicorn>={uvicorn.__version__}')
          " > requirements.txt

      - name: Commit & Push If Changes Detected
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [[ -n $(git status -s requirements.txt) ]]; then
            git add requirements.txt
            git commit -m "chore(engines): auto-update upstream scraper dependencies [skip ci]"
            git push origin main
            echo "Upstream engines updated and pushed to main!"
          else
            echo "All upstream engines are already at latest version."
          fi
