name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Dikonsumsi Vite saat build → ter-bundle ke JS.
          # Set di GitHub → Settings → Secrets and variables → Actions
          VITE_JEREXD_DEFAULT_KEY: ${{ secrets.VITE_JEREXD_DEFAULT_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 2e9b5d234a5ff40ceb2377f739e0718b
          projectName: downloadkan
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
